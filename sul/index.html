<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>술술술</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
    rel="stylesheet"
  />
  <style>
  :root {
    --bg-main: #e7fff1;
    --bg-panel: #fafffc;
    --bg-chip: #defdf4;
    --border-strong: #2c8a64;
    --border-soft: #9be7c8;
    --accent-green: #1f996a;
    --accent-red: #2eb3c7;
    --accent-yellow: #a5f5ff;
    --text-main: #124434;
    --text-soft: #4f7f6d;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    padding: 32px 16px 48px;
    font-family: "Press Start 2P", cursive;
    font-size: 0.85rem;
    background:
      linear-gradient(90deg, #dff7ef 1px, transparent 1px),
      linear-gradient(180deg, #dff7ef 1px, transparent 1px),
      var(--bg-main);
    background-size: 16px 16px, 16px 16px, auto;
  }

  .top-area {
    width: min(900px, 100%);
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
  }

  header {
    width: min(520px, 100%);
  }

  h1 {
    margin: 0 0 12px;
    font-size: 1.35rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--border-strong);
    text-shadow: 0 0 0 #000, 1px 1px 0 #c8f7e7;
  }

  .title-glitch {
    display: flex;
    gap: 6px;
  }

  .title-glitch span {
    display: inline-flex;
    transform-origin: center;
    letter-spacing: 0.02em;
  }

  .title-glitch span:nth-child(odd) {
    transform: rotate(-6deg) translateY(-2px);
  }

  .title-glitch span:nth-child(even) {
    transform: rotate(5deg) translateY(3px);
  }

  .controls {
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: var(--bg-panel);
    padding: 14px 14px 16px;
    border: 3px solid var(--border-strong);
    border-radius: 0;
    box-shadow:
      0 0 0 2px #e6fff4,
      0 4px 0 0 #1d5a43;
  }

  .controls.hidden {
    display: none;
  }

  .controls label {
    font-weight: 700;
    font-size: 0.86rem;
    color: var(--text-main);
  }

  .controls input {
    padding: 8px 10px;
    border: 2px solid var(--border-soft);
    border-radius: 0;
    font-size: 0.9rem;
    background: #fff;
    outline: none;
    box-shadow:
      inset 0 0 0 1px #fff,
      0 0 0 1px #fff;
  }

  .controls input:focus {
    border-color: var(--accent-green);
    box-shadow:
      inset 0 0 0 1px #fff,
      0 0 0 1px #c1ffe6;
  }

  .controls button {
    margin-top: 4px;
    padding: 9px 10px;
    border: 0;
    border-radius: 0;
    background: var(--accent-green);
    color: #fff;
    font-size: 0.82rem;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    box-shadow:
      0 0 0 2px #edfff7,
      0 4px 0 0 #144734;
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }

  .controls button:hover {
    transform: translate(-1px, -1px);
    box-shadow:
      0 0 0 2px #edfff7,
      0 5px 0 0 #144734;
  }

  .controls button:active {
    transform: translate(0, 2px);
    box-shadow:
      0 0 0 2px #edfff7,
      0 1px 0 0 #144734;
  }

  .week-note {
    margin-top: 4px;
    font-size: 0.75rem;
    color: var(--text-soft);
  }

  .change-goal {
    padding: 9px 14px;
    border: 0;
    border-radius: 0;
    background: var(--bg-chip);
    color: var(--border-strong);
    font-size: 0.78rem;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    box-shadow:
      0 0 0 2px #effff8,
      0 4px 0 0 #1f8062;
    display: none;
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }

  .change-goal.visible {
    display: inline-flex;
  }

  .change-goal:hover {
    transform: translate(-1px, -1px);
    box-shadow:
      0 0 0 2px #effff8,
      0 5px 0 0 #1f8062;
  }

  .change-goal:active {
    transform: translate(0, 2px);
    box-shadow:
      0 0 0 2px #effff8,
      0 1px 0 0 #1f8062;
  }

.goal-board {
  width: min(900px, 100%);
  background: var(--bg-panel);
    border-radius: 0;
    padding: 16px 18px 20px;
    border: 3px solid var(--border-strong);
    box-shadow:
      0 0 0 2px #e6fff4,
      0 6px 0 0 #1d5a43;
    transition: border-color 0.16s ease, box-shadow 0.16s ease, transform 0.16s ease;
  }

  .goal-board.on-track {
    border-color: #52c694;
    box-shadow:
      0 0 0 2px #e1fff3,
      0 7px 0 0 #1f684d;
    transform: translateY(-1px);
  }

  .goal-board.over-goal {
    border-color: var(--accent-red);
    box-shadow:
      0 0 0 2px #d4faff,
      0 7px 0 0 #127a8c;
    transform: translateY(-1px);
  }

  .goal-status {
    font-size: 0.86rem;
    font-weight: 700;
    margin-bottom: 14px;
    padding: 6px 8px;
    border-radius: 0;
    background: #f1fff9;
    border: 2px solid #c0f3de;
    color: var(--text-main);
  }

  .summary-board {
    width: min(900px, 100%);
    background: var(--bg-panel);
    border: 3px solid var(--border-strong);
    border-radius: 0;
    padding: 14px 18px 18px;
    box-shadow:
      0 0 0 2px #e6fff4,
      0 5px 0 0 #1d5a43;
  }

  .summary-board h2 {
    margin: 0 0 12px;
    font-size: 0.78rem;
    color: var(--text-main);
    letter-spacing: 0.04em;
  }

  .summary-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }

  .summary-box {
    flex: 1 1 200px;
    background: #f0fff6;
    border: 2px solid #9fdcc1;
    box-shadow:
      0 0 0 1px #fff,
      0 3px 0 0 #5a9e83;
    padding: 10px;
  }

  .summary-title {
    margin: 0 0 6px;
    font-size: 0.65rem;
    color: var(--text-soft);
  }

  .summary-value {
    margin: 0;
    font-size: 0.75rem;
  color: var(--text-main);
}

.summary-board {
  width: min(900px, 100%);
  background: var(--bg-panel);
  border-radius: 0;
  padding: 16px 18px 20px;
  border: 3px solid var(--border-strong);
  box-shadow:
    0 0 0 2px #e6fff4,
    0 5px 0 0 #1d5a43;
}

.summary-board h2 {
  margin: 0 0 12px;
  font-size: 0.78rem;
  color: var(--text-main);
  letter-spacing: 0.04em;
}

.summary-row {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}

.summary-box {
  flex: 1 1 200px;
  background: #f0fff6;
  border: 2px solid #9fdcc1;
  box-shadow:
    0 0 0 1px #fff,
    0 3px 0 0 #5a9e83;
  padding: 10px;
}

.summary-title {
  margin: 0 0 6px;
  font-size: 0.65rem;
  color: var(--text-soft);
}

.summary-value {
  margin: 0;
  font-size: 0.75rem;
  color: var(--text-main);
}

.summary-reset {
  margin-left: 8px;
  padding: 4px 6px;
  border: 0;
  border-radius: 0;
  font-size: 0.55rem;
  background: #b5f0dd;
  color: #134631;
  cursor: pointer;
  box-shadow:
    0 0 0 2px #e4fff5,
    0 2px 0 0 #1f6a4c;
}

.summary-reset:active {
  transform: translateY(1px);
  box-shadow:
    0 0 0 2px #e4fff5,
    0 1px 0 0 #1f6a4c;
}

.soju-grid {
  display: grid;
    grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
    gap: 14px 10px;
    justify-items: center;
    min-height: 120px;
  }

  .soju-grid:empty::after {
    content: "목표 병 수를 정하면 네모난 병이 줄줄이 생겨요 (•ᴗ•)و";
    grid-column: 1 / -1;
    color: var(--text-soft);
    font-size: 0.78rem;
    text-align: center;
  }

  .soju {
    position: relative;
    --large-height: 82px;
    --small-height: 26px;
    width: 72px;
    height: 150px;
    padding-bottom: 26px;
    cursor: pointer;
    transition: transform 0.08s ease;
  }

  .soju:hover {
    transform: translateY(-2px);
  }

  .soju.drained {
    filter: grayscale(0.2);
  }

  .cylinder {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    --ellipse-height: 0;
    background: #4cbf92;
    border-radius: 4px;
    border: 3px solid #287457;
    box-shadow:
      inset 0 0 0 2px #8ff2c8,
      0 0 0 2px #e1fff3;
  }

  .cylinder::before,
  .cylinder::after {
    content: "";
    position: absolute;
    pointer-events: none;
  }

  .cylinder::before {
    top: 4px;
    left: 4px;
    right: 10px;
    height: 6px;
    background: rgba(255, 255, 255, 0.4);
  }

  .cylinder::after {
    bottom: 4px;
    left: 6px;
    right: 6px;
    height: 4px;
    background: rgba(0, 0, 0, 0.12);
  }

  .cylinder-large {
    --diameter: 52px;
    --height: var(--large-height);
    bottom: 22px;
    width: var(--diameter);
    height: var(--height);
  }

  .cylinder-small {
    --diameter: 26px;
    --height: var(--small-height);
    bottom: calc(var(--large-height) + 24px);
    width: calc(var(--diameter) * 0.77);
    height: calc(var(--height) * 1.1);
    background: #3da37c;
    margin-bottom: 0;
    border-bottom: none;
    box-shadow:
      inset 0 0 0 2px #7be9c4,
      0 -2px 0 0 #7be9c4,
      0 0 0 2px #e1fff3;
  }

  .cylinder-small::after {
    display: none;
  }

  .liquid {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    bottom: 26px;
    width: 44px;
    height: calc(var(--fill-level, 1) * 66px);
    background: linear-gradient(180deg, rgba(230, 251, 255, 0.8), rgba(100, 193, 212, 0.65), rgba(63, 160, 184, 0.7));
    border-radius: 3px;
    box-shadow:
      inset 0 0 0 2px rgba(0, 0, 0, 0.12),
      inset 0 2px 0 0 rgba(255, 255, 255, 0.5);
    z-index: 1;
    overflow: hidden;
  }

  .liquid::before {
    content: "";
    position: absolute;
    top: 2px;
    left: 3px;
    right: 14px;
    height: 4px;
    background: rgba(255, 255, 255, 0.7);
  }

  .soju.drained .liquid {
    height: 0;
    box-shadow: none;
  }

  .bottle-label {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    width: 50%;
    min-height: 22px;
    padding: 4px 3px 5px;
    background: #f0fff6;
    border-radius: 0;
    border: 2px solid #9fdcc1;
    box-shadow:
      0 0 0 1px #fff,
      0 2px 0 0 #5a9e83;
    font-size: 0.5rem;
    color: var(--text-main);
    display: flex;
    flex-direction: column;
    gap: 2px;
    text-align: center;
    transition: opacity 0.1s ease;
  }

  .bottle-label.empty {
    opacity: 0;
  }

  .bottle-label .label-day {
    font-weight: 800;
    font-size: 0.7rem;
    color: #116047;
  }

  .bottle-label .label-date {
    font-size: 0.32rem;
    color: #2c6b55;
  }

  .bottle-label .label-memo {
    font-size: 0.62rem;
    color: #2a7258;
    line-height: 1.15;
    word-break: keep-all;
  }

  .soju.over-goal {
    box-shadow: 0 0 0 2px #8bdef0;
  }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(4, 45, 39, 0.65);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 1000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.16s ease;
  }

  .modal-overlay.active {
    opacity: 1;
    pointer-events: auto;
  }

  .modal {
    background: #effff7;
    border-radius: 0;
    padding: 18px 16px 16px;
    width: min(340px, 100%);
    border: 3px solid var(--border-strong);
    box-shadow:
      0 0 0 2px #e6fff4,
      0 8px 0 0 #1d5a43;
  }

  .modal h2 {
    margin: 0 0 10px;
    font-size: 0.9rem;
    color: var(--border-strong);
  }

  .modal label {
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-size: 0.78rem;
    margin-bottom: 10px;
    font-weight: 600;
    color: var(--text-main);
  }

  .modal input,
  .modal textarea {
    padding: 8px 10px;
    border-radius: 0;
    border: 2px solid #bff1dc;
    font-size: 0.85rem;
    font-family: inherit;
    background: #ffffff;
  }

  .modal textarea {
    resize: vertical;
    min-height: 70px;
  }

  .modal-buttons {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 8px;
  }

  .modal-buttons button {
    padding: 7px 12px;
    border-radius: 0;
    border: 0;
    font-weight: 700;
    font-size: 0.78rem;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  .modal-buttons .cancel {
    background: #e0f7f0;
    color: var(--text-main);
    box-shadow:
      0 0 0 2px #edfff7,
      0 3px 0 0 #2b7460;
  }

  .modal-buttons .delete {
    background: #ffe5e5;
    color: #7a1e1e;
    box-shadow:
      0 0 0 2px #fff7f7,
      0 3px 0 0 #a84444;
    display: none;
  }

  .modal-buttons .submit {
    background: var(--accent-green);
    color: #fff;
    box-shadow:
      0 0 0 2px #edfff7,
      0 3px 0 0 #144734;
  }

  .modal-buttons .cancel:active,
  .modal-buttons .delete:active,
  .modal-buttons .submit:active {
    transform: translateY(1px);
    box-shadow:
      0 0 0 2px #edfff7,
      0 1px 0 0 rgba(0, 0, 0, 0.25);
  }

  @media (max-width: 640px) {
    body {
      padding-top: 24px;
    }

    .top-area {
      flex-direction: column;
      align-items: stretch;
      gap: 10px;
    }

    .change-goal {
      align-self: flex-end;
    }
  }
</style>
</head>
<body>
  <div class="top-area">
    <header>
      <h1 class="title-glitch">
        <span>금</span>
        <span>주</span>
        <span>해</span>
        <span>보</span>
        <span>자</span>
      </h1>
      <div class="controls" id="goal-controls">
        <label for="weekly-goal">이번주 목표 제한 주량 (병)</label>
        <input
          type="number"
          id="weekly-goal"
          name="weekly-goal"
          min="0"
          step="1"
          inputmode="numeric"
          placeholder="예: 3"
        />
        <button type="button" id="register-goal">목표 등록</button>
        <p class="week-note">한 주는 일요일 시작, 월요일 종료 기준입니다.</p>
      </div>
    </header>
    <button type="button" id="change-goal" class="change-goal">주량 변경</button>
  </div>

  <section class="goal-board" aria-live="polite">
    <p class="goal-status" id="goal-status">목표 주량을 입력하고 등록해 주세요.</p>
    <div id="soju-grid" class="soju-grid"></div>
  </section>

  <section class="summary-board" aria-live="polite">
    <h2>누적 통계</h2>
    <div class="summary-row">
      <div class="summary-box">
        <p class="summary-title">이번 달</p>
        <p class="summary-value">
          <span id="month-bottles">0</span>병 /
          <span id="month-amount">0</span>원
          <button type="button" class="summary-reset" id="reset-month">리셋</button>
        </p>
      </div>
      <div class="summary-box">
        <p class="summary-title">올해 전체</p>
        <p class="summary-value">
          <span id="year-bottles">0</span>병 /
          <span id="year-amount">0</span>원
          <button type="button" class="summary-reset" id="reset-year">리셋</button>
        </p>
      </div>
    </div>
  </section>

  <template id="soju-template">
    <div class="soju" role="img" aria-label="소주 병" data-fill="1">
      <div class="cylinder cylinder-large"></div>
      <div class="liquid"></div>
      <div class="cylinder cylinder-small"></div>
      <div class="bottle-label empty">
        <span class="label-day"></span>
        <span class="label-date"></span>
        <span class="label-memo"></span>
      </div>
    </div>
  </template>

  <div class="modal-overlay" id="log-modal" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h2 id="modal-title">마신 기록 남기기</h2>
      <form id="log-form">
        <label for="log-date">
          마신 날짜
          <input type="date" id="log-date" required />
        </label>
        <label for="log-memo">
          메모 (최대 8자)
          <textarea id="log-memo" maxlength="8" placeholder="간단히 8자 이내로"></textarea>
        </label>
        <label for="log-price">
          그날 술값 (원)
          <input type="number" id="log-price" min="0" step="100" placeholder="예: 12000" />
        </label>
        <div class="modal-buttons">
          <button type="button" class="cancel" id="cancel-log">취소</button>
          <button type="button" class="delete" id="delete-log">삭제</button>
          <button type="submit" class="submit">기록 완료</button>
        </div>
      </form>
    </div>
  </div>
  
  <script>
    const goalInput = document.getElementById("weekly-goal");
    const registerButton = document.getElementById("register-goal");
    const sojuGrid = document.getElementById("soju-grid");
    const goalStatus = document.getElementById("goal-status");
    const sojuTemplate = document.getElementById("soju-template");
    const goalBoard = document.querySelector(".goal-board");
    const logModal = document.getElementById("log-modal");
    const logForm = document.getElementById("log-form");
    const logDateInput = document.getElementById("log-date");
    const logMemoInput = document.getElementById("log-memo");
    const logPriceInput = document.getElementById("log-price");
    const cancelLogButton = document.getElementById("cancel-log");
    const deleteLogButton = document.getElementById("delete-log");
    const changeGoalButton = document.getElementById("change-goal");
    const controlsPanel = document.getElementById("goal-controls");
    const summaryMonthBottles = document.getElementById("month-bottles");
    const summaryMonthAmount = document.getElementById("month-amount");
    const summaryYearBottles = document.getElementById("year-bottles");
    const summaryYearAmount = document.getElementById("year-amount");
    const resetMonthButton = document.getElementById("reset-month");
    const resetYearButton = document.getElementById("reset-year");

    const WEEKLY_STORE_KEY = "weeklyStore";
    const LAST_WEEK_KEY = "lastWeekKey";
    const LOG_STORE_KEY = "sojuLogs";
    const dayNames = ["일", "월", "화", "수", "목", "금", "토"];

    let weeklyStore = loadWeeklyStore();
    const todayISO = getTodayISO();
    const currentWeekKey = getWeekKeyFromISO(todayISO);

    ensureWeekExists();
    ensureWeekRollover();

    let currentWeek = weeklyStore[currentWeekKey];
    ensureWeekLogIds();

    let consumedCount = currentWeek.logs.length;
    let selectedBottleIndex = null;
    let editingExisting = false;

    renderWeekState();
    updateSummaryFromLogs();

    registerButton.addEventListener("click", handleRegisterGoal);
    changeGoalButton.addEventListener("click", handleChangeGoal);
    sojuGrid.addEventListener("click", handleBottleClick);
    logForm.addEventListener("submit", handleLogSubmit);
    cancelLogButton.addEventListener("click", closeModal);
    logModal.addEventListener("click", (event) => {
      if (event.target === logModal) closeModal();
    });
    resetMonthButton.addEventListener("click", handleResetMonth);
    resetYearButton.addEventListener("click", handleResetYear);
    deleteLogButton.addEventListener("click", handleDeleteLog);

    function loadWeeklyStore() {
      try {
        const raw = localStorage.getItem(WEEKLY_STORE_KEY);
        return raw ? JSON.parse(raw) : {};
      } catch (_) {
        return {};
      }
    }

    function saveWeeklyStore() {
      localStorage.setItem(WEEKLY_STORE_KEY, JSON.stringify(weeklyStore));
    }

    function loadLogs() {
      try {
        const raw = localStorage.getItem(LOG_STORE_KEY);
        const parsed = raw ? JSON.parse(raw) : [];
        if (!Array.isArray(parsed)) return [];
        let changed = false;
        parsed.forEach((log, idx) => {
          if (!log.id) {
            log.id = `legacy-${idx}-${Date.now()}-${Math.floor(Math.random() * 1000)}`;
            changed = true;
          }
        });
        if (changed) saveLogs(parsed);
        return parsed;
      } catch (_) {
        return [];
      }
    }

    function saveLogs(logs) {
      localStorage.setItem(LOG_STORE_KEY, JSON.stringify(logs));
    }

    function upsertSummaryLog(entry) {
      const logs = loadLogs();
      const idx = logs.findIndex((log) => log.id === entry.id);
      if (idx >= 0) {
        logs[idx] = { ...logs[idx], ...entry };
      } else {
        logs.push(entry);
      }
      saveLogs(logs);
    }

    function removeSummaryLog(logId) {
      if (!logId) return;
      const logs = loadLogs();
      const filtered = logs.filter((log) => log.id !== logId);
      if (filtered.length !== logs.length) {
        saveLogs(filtered);
      }
    }

    function updateSummaryFromLogs() {
      const logs = loadLogs();
      const now = new Date();
      const currentYear = now.getFullYear();
      const currentMonth = now.getMonth();

      let monthBottles = 0;
      let monthAmount = 0;
      let yearBottles = 0;
      let yearAmount = 0;

      logs.forEach((log) => {
        const d = new Date(log.date);
        if (Number.isNaN(d.getTime())) return;
        const y = d.getFullYear();
        const m = d.getMonth();
        const count = log.count || 1;
        const price = typeof log.price === "number" ? log.price : 0;

        if (y === currentYear) {
          yearBottles += count;
          yearAmount += price;
          if (m === currentMonth) {
            monthBottles += count;
            monthAmount += price;
          }
        }
      });

      summaryMonthBottles.textContent = monthBottles;
      summaryMonthAmount.textContent = monthAmount.toLocaleString();
      summaryYearBottles.textContent = yearBottles;
      summaryYearAmount.textContent = yearAmount.toLocaleString();
    }

    function getTodayISO() {
      const now = new Date();
      return [
        now.getFullYear(),
        String(now.getMonth() + 1).padStart(2, "0"),
        String(now.getDate()).padStart(2, "0"),
      ].join("-");
    }

    function getWeekKeyFromISO(isoDate) {
      const [y, m, d] = isoDate.split("-").map(Number);
      const date = new Date(y, m - 1, d);
      const day = date.getDay();
      date.setDate(date.getDate() - day);
      return [
        date.getFullYear(),
        String(date.getMonth() + 1).padStart(2, "0"),
        String(date.getDate()).padStart(2, "0"),
      ].join("-");
    }

    function ensureWeekExists() {
      if (!weeklyStore[currentWeekKey]) {
        weeklyStore[currentWeekKey] = { goal: null, logs: [] };
        saveWeeklyStore();
      }
    }

    function ensureWeekRollover() {
      const last = localStorage.getItem(LAST_WEEK_KEY);
      if (last !== currentWeekKey) {
        localStorage.setItem(LAST_WEEK_KEY, currentWeekKey);
        ensureWeekExists();
      }
    }

    function ensureWeekLogIds() {
      let changed = false;
      currentWeek.logs.forEach((log, idx) => {
        if (!log.id) {
          log.id = generateLogId(currentWeekKey, idx);
          changed = true;
        }
      });
      if (changed) saveWeeklyStore();
    }

    function generateLogId(weekKey, index) {
      return `${weekKey}-${index}-${Date.now()}-${Math.floor(Math.random() * 1000)}`;
    }

    function getDayLabelFromDate(dateStr) {
      if (!dateStr) return "";
      const d = new Date(dateStr);
      if (Number.isNaN(d.getTime())) return "";
      return dayNames[d.getDay()];
    }

    function formatDateLabel(dateStr) {
      if (!dateStr) return "";
      const parts = dateStr.split("-");
      if (parts.length !== 3) return dateStr;
      return `${parts[1]}.${parts[2]}`;
    }

    function showGoalControls() {
      controlsPanel.classList.remove("hidden");
      changeGoalButton.classList.remove("visible");
      sojuGrid.innerHTML = "";
      goalStatus.textContent = "이번 주 목표를 입력해 주세요.";
    }

    function hideGoalControls() {
      controlsPanel.classList.add("hidden");
      changeGoalButton.classList.add("visible");
    }

    function setFillLevel(bottle, ratio) {
      const liquid = bottle.querySelector(".liquid");
      if (liquid) {
        liquid.style.setProperty("--fill-level", ratio);
      }
    }

    function createBottleElement(index) {
      const bottle = sojuTemplate.content.firstElementChild.cloneNode(true);
      bottle.dataset.index = index;
      const label = bottle.querySelector(".bottle-label");
      const dayText = label.querySelector(".label-day");
      const dateText = label.querySelector(".label-date");
      const memoText = label.querySelector(".label-memo");

      if (index < currentWeek.logs.length) {
        const log = currentWeek.logs[index];
        if (!log.id) {
          log.id = generateLogId(currentWeekKey, index);
          saveWeeklyStore();
        }
        bottle.classList.add("drained");
        setFillLevel(bottle, 0);
        label.classList.remove("empty");
        dayText.textContent = getDayLabelFromDate(log.date);
        dateText.textContent = formatDateLabel(log.date);
        memoText.textContent = log.memo ? log.memo.slice(0, 24) : "";
      } else {
        bottle.classList.remove("drained");
        setFillLevel(bottle, 1);
        label.classList.add("empty");
        dayText.textContent = "";
        dateText.textContent = "";
        memoText.textContent = "";
      }

      return bottle;
    }

    function renderWeekState() {
      currentWeek = weeklyStore[currentWeekKey];
      ensureWeekLogIds();
      consumedCount = currentWeek.logs.length;
      if (currentWeek.goal === null) {
        showGoalControls();
      } else {
        hideGoalControls();
        renderBottles();
      }
    }

    function renderBottles() {
      sojuGrid.innerHTML = "";
      if (!currentWeek.goal) {
        goalStatus.textContent = "이번 주 목표를 입력해 주세요.";
        return;
      }
      for (let i = 0; i < currentWeek.goal; i += 1) {
        sojuGrid.appendChild(createBottleElement(i));
      }
      consumedCount = currentWeek.logs.length;
      updateGoalStatus();
    }

    function updateGoalStatus() {
      goalBoard.classList.remove("on-track", "over-goal");
      if (!currentWeek.goal) {
        goalStatus.textContent = "이번 주 목표를 입력해 주세요.";
        return;
      }
      const remaining = Math.max(currentWeek.goal - consumedCount, 0);
      goalStatus.textContent = `이번 주 목표: ${currentWeek.goal}병 / 기록: ${consumedCount}병 (남은 ${remaining}병)`;
      goalBoard.classList.add(consumedCount > currentWeek.goal ? "over-goal" : "on-track");
    }

    function handleRegisterGoal() {
      const value = parseInt(goalInput.value, 10);
      if (Number.isNaN(value) || value <= 0) {
        goalStatus.textContent = "1병 이상 정수로 목표를 입력해 주세요.";
        goalInput.focus();
        return;
      }
      currentWeek.goal = value;
      if (currentWeek.logs.length > value) {
        currentWeek.logs = currentWeek.logs.slice(0, value);
      }
      saveWeeklyStore();
      goalInput.value = "";
      renderWeekState();
    }

    function handleChangeGoal() {
      goalInput.value = currentWeek.goal ?? "";
      showGoalControls();
    }

    function handleBottleClick(event) {
      const bottle = event.target.closest(".soju");
      if (!bottle || currentWeek.goal === null) return;
      const index = Number(bottle.dataset.index);
      if (Number.isNaN(index)) return;
      if (index > currentWeek.goal - 1) return;

      selectedBottleIndex = index;
      editingExisting = index < currentWeek.logs.length;

      if (editingExisting) {
        const log = currentWeek.logs[index];
        logDateInput.value = log.date || getTodayISO();
        logMemoInput.value = log.memo || "";
        logPriceInput.value = log.price ? String(log.price) : "";
      } else {
        if (index > currentWeek.logs.length) {
          alert("앞의 병부터 순서대로 기록해 주세요.");
          return;
        }
        logDateInput.value = getTodayISO();
        logMemoInput.value = "";
        logPriceInput.value = "";
      }

      deleteLogButton.style.display = editingExisting ? "inline-flex" : "none";

      logModal.classList.add("active");
      logModal.setAttribute("aria-hidden", "false");
      logDateInput.focus();
    }

    function handleLogSubmit(event) {
      event.preventDefault();
      if (selectedBottleIndex === null || currentWeek.goal === null) return;

      const date = logDateInput.value || getTodayISO();
      const memo = logMemoInput.value.trim().slice(0, 8);
      const priceValue = Number.parseInt(logPriceInput.value, 10);
      const price = Number.isNaN(priceValue) ? 0 : priceValue;

      if (editingExisting) {
        const log = currentWeek.logs[selectedBottleIndex];
        log.date = date;
        log.memo = memo;
        log.price = price;
        if (!log.id) {
          log.id = generateLogId(currentWeekKey, selectedBottleIndex);
        }
        saveWeeklyStore();
        upsertSummaryLog({ id: log.id, date, memo, price, count: 1 });
      } else {
        if (currentWeek.logs.length >= currentWeek.goal) {
          alert("목표 병 수를 모두 기록했습니다.");
          closeModal();
          return;
        }
        if (selectedBottleIndex !== currentWeek.logs.length) {
          alert("앞 순서부터 기록해 주세요.");
          return;
        }
        const newLog = {
          id: generateLogId(currentWeekKey, currentWeek.logs.length),
          date,
          memo,
          price,
        };
        currentWeek.logs.push(newLog);
        saveWeeklyStore();
        upsertSummaryLog({ ...newLog, count: 1 });
        consumedCount = currentWeek.logs.length;
      }

      renderBottles();
      updateSummaryFromLogs();
      closeModal();
    }

    function handleDeleteLog() {
      if (!editingExisting || selectedBottleIndex === null) return;
      const log = currentWeek.logs[selectedBottleIndex];
      if (!log) {
        closeModal();
        return;
      }
      currentWeek.logs.splice(selectedBottleIndex, 1);
      saveWeeklyStore();
      if (log.id) removeSummaryLog(log.id);
      consumedCount = currentWeek.logs.length;
      renderBottles();
      updateGoalStatus();
      updateSummaryFromLogs();
      closeModal();
    }

    function closeModal() {
      logModal.classList.remove("active");
      logModal.setAttribute("aria-hidden", "true");
      selectedBottleIndex = null;
      editingExisting = false;
      logForm.reset();
      deleteLogButton.style.display = "none";
    }

    function handleResetMonth() {
      const logs = loadLogs();
      const now = new Date();
      const currentYear = now.getFullYear();
      const currentMonth = now.getMonth();
      const filtered = logs.filter((log) => {
        const d = new Date(log.date);
        if (Number.isNaN(d.getTime())) return false;
        const y = d.getFullYear();
        const m = d.getMonth();
        return !(y === currentYear && m === currentMonth);
      });
      saveLogs(filtered);
      updateSummaryFromLogs();
    }

    function handleResetYear() {
      const logs = loadLogs();
      const currentYear = new Date().getFullYear();
      const filtered = logs.filter((log) => {
        const d = new Date(log.date);
        if (Number.isNaN(d.getTime())) return false;
        return d.getFullYear() !== currentYear;
      });
      saveLogs(filtered);
      updateSummaryFromLogs();
    }
  </script>

</body>
